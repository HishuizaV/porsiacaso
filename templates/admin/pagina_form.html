{% extends "admin/base_admin.html" %}
{% block title %}Editar página{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">
{% endblock %}

{% block content %}
<h1>Editar: {{ p.titulo }}</h1>

<form method="post" id="form" class="form-art">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Título
        <input name="titulo" value="{{ p.titulo }}" maxlength="120" required>
    </label>
    <div>
        <span class="etiqueta">Contenido</span>
        <div id="editor">{{ p.contenido|safe }}</div>
        <input type="hidden" name="contenido" id="contenido">
    </div>
    <button class="btn-adm">Guardar</button>
</form>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        modules: { toolbar: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'link'],
            ['clean']
        ]}
    });
    document.getElementById('form').addEventListener('submit', function () {
        document.getElementById('contenido').value = quill.root.innerHTML;
    });
</script>
{% endblock %}
